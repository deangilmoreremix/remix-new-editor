name: Template-to-Video CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/unit/template-studio-generation.unit.spec.ts'
      - 'tests/unit/cinema-template-studio.unit.spec.ts'
      - 'tests/unit/cinema-template-scene-builder.unit.spec.ts'
      - 'tests/unit/timeline-muapi-generation-service.unit.spec.ts'
      - 'tests/unit/thumbnail-service.unit.spec.ts'
      - 'tests/unit/cinematic-templates.unit.spec.ts'
      - 'tests/unit/template-engine.unit.spec.ts'
      - 'src/test/muapi-fixes.test.js'
      - 'src/**'
      - 'vitest.config.js'
      - 'package.json'
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  template-to-video-tests:
    name: Template-to-Video Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run -- tests/unit/template-studio-generation.unit.spec.ts tests/unit/cinema-template-studio.unit.spec.ts tests/unit/cinema-template-scene-builder.unit.spec.ts tests/unit/timeline-muapi-generation-service.unit.spec.ts tests/unit/thumbnail-service.unit.spec.ts tests/unit/cinematic-templates.unit.spec.ts tests/unit/template-engine.unit.spec.ts src/test/muapi-fixes.test.js
        env:
          CI: true

  canary-deploy:
    name: Canary Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm run build --workspace apps/director/frontend

      - name: Deploy canary to Render
        id: canary-deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_CANARY_BACKEND_SERVICE_ID: ${{ secrets.RENDER_CANARY_BACKEND_SERVICE_ID }}
          RENDER_CANARY_FRONTEND_SERVICE_ID: ${{ secrets.RENDER_CANARY_FRONTEND_SERVICE_ID }}
          CANARY_BACKEND_URL: ${{ vars.CANARY_BACKEND_URL || '' }}
          CANARY_FRONTEND_URL: ${{ vars.CANARY_FRONTEND_URL || '' }}
        run: |
          CANARY_DEPLOYED=false

          if [ -n "$RENDER_CANARY_BACKEND_SERVICE_ID" ]; then
            echo "Deploying director-backend canary..."
            BACKEND_RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$RENDER_CANARY_BACKEND_SERVICE_ID/deploys" \
              -d '{"clearCache": "clear"}')
            echo "Backend deploy response: $BACKEND_RESPONSE"
            CANARY_DEPLOYED=true
          fi

          if [ -n "$RENDER_CANARY_FRONTEND_SERVICE_ID" ]; then
            echo "Deploying director-frontend canary..."
            FRONTEND_RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$RENDER_CANARY_FRONTEND_SERVICE_ID/deploys" \
              -d '{"clearCache": "clear"}')
            echo "Frontend deploy response: $FRONTEND_RESPONSE"
            CANARY_DEPLOYED=true
          fi

          if [ "$CANARY_DEPLOYED" = "false" ]; then
            echo "No canary service IDs configured. Skipping canary deploy."
            echo "canary_url=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Waiting for canary deploys to initialize..."
          sleep 60

          CANARY_URL=""
          if [ -n "$CANARY_FRONTEND_URL" ]; then
            CANARY_URL="$CANARY_FRONTEND_URL"
          elif [ -n "$CANARY_BACKEND_URL" ]; then
            CANARY_URL="$CANARY_BACKEND_URL"
          fi

          echo "canary_url=$CANARY_URL" >> $GITHUB_OUTPUT

      - name: Comment canary URL on PR
        if: steps.canary-deploy.outputs.canary_url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const canaryUrl = '${{ steps.canary-deploy.outputs.canary_url }}';
            if (!canaryUrl) {
              console.log('No canary URL available, skipping PR comment.');
              return;
            }
            const body = `## 🐤 Canary Deploy\n\nA canary build has been deployed for this PR.\n\n**Canary URL:** ${canaryUrl}\n\nThis is a preview environment. Please verify the changes before merging.`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
