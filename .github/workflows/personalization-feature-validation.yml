name: Personalization Feature Validation

on:
  push:
    branches:
      - feature/unified-personalization-image-editor

permissions:
  contents: read

jobs:
  validate-personalization:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Scoped personalization tests
        run: >
          npx vitest run
          src/test/personalization-image-editor-registry.test.js
          src/test/personalization-image-editor-ui.test.js
          src/test/personalization-studio-context.test.js
          src/test/personalization-video-ready.test.js
          src/test/unified-personalization-profile.test.js
          src/test/personalization-cinema-adapter.test.js
          src/test/personalization-asset-security.test.js
          src/test/personalizer.test.js
          src/test/personalizer-handoff.test.js
          src/test/personalizer-route.test.js
      - name: Lint changed personalization surface
        run: >
          npx eslint
          src/components/modals/PersonalizeModal.jsx
          src/components/VideoStudio.js
          src/components/ImageStudio.js
          src/components/CinemaStudio.js
          src/components/TemplateStudio.js
          src/lib/personalization
          src/lib/personalizerAdapters.js
          netlify/functions/personalizer-api.js
          netlify/functions/_personalizationAssets.js
          netlify/functions/_businessDiscovery.js
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
