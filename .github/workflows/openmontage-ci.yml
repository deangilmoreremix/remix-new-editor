name: OpenMontage CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: vendor/openmontage/requirements.txt
      - name: Install dependencies
        run: |
          cd vendor/openmontage
          pip install -r requirements.txt
          pip install ruff bandit
      - name: Lint with ruff
        run: ruff check vendor/openmontage/
      - name: Security scan with bandit
        run: bandit -r vendor/openmontage/ -ll

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: vendor/openmontage/requirements.txt
      - name: Install dependencies
        run: |
          cd vendor/openmontage
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        run: |
          cd vendor/openmontage
          python -m pytest tests/ -v --tb=short
        env:
          OPENMONTAGE_MASTER_KEY: "dGVzdC1rZXktZm9yLWNpLXJ1bm5pbmctdGVzdHM="
          ENVIRONMENT: "test"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t openmontage-api:${{ github.sha }} vendor/openmontage/
      - name: Test Docker image
        run: |
          docker run -d --name test-api -p 10000:10000 \
            -e OPENMONTAGE_MASTER_KEY=dGVzdC1rZXktZm9yLWNpLXJ1bm5pbmctdGVzdHM= \
            -e ENVIRONMENT=test \
            openmontage-api:${{ github.sha }}
          sleep 5
          curl -f http://localhost:10000/health || exit 1
          docker stop test-api
