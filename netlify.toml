# Netlify build configuration
[build]
  command = "npm install --include=optional && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Server-only secrets that the Netlify functions read at runtime. Listing them
  # here keeps the build-time secrets scanner from failing a deploy when one of
  # them legitimately appears in a log line or build output. Every name below is
  # read ONLY by code under netlify/functions/ (server-side) — none is inlined
  # into the client bundle, and none carries a VITE_ prefix.
  SECRETS_SCAN_OMIT_KEYS = "CLERK_SECRET_KEY,MAIGRET_WORKER_SECRET,MAIGRET_WORKER_URL,PERSONALIZATION_DISCOVERY_SECRET,SUPABASE_SERVICE_ROLE_KEY,CLERK_WEBHOOK_SIGNING_SECRET,OPENAI_API_KEY,MUAPI_API_KEY,PIXABAY_API_KEY,FAL_KEY,GEMINI_API_KEY,GITHUB_TOKEN"

# MEDIA UPLOADS DO NOT TRANSIT NETLIFY FUNCTIONS.
# Netlify synchronous functions cap the request payload at 6 MB (≈4.5 MB for
# binary bytes after ~30% Base64 overhead) and the sync execution limit is 60s
# (https://docs.netlify.com/build/functions/configuration). A 50 MB video cannot
# pass through a sync function, so media bytes NEVER relay here. Media rides the
# dedicated browser paths (see docs/MUAPI_UPLOAD_ARCHITECTURE.md):
#   • small files  → Supabase edge proxy (supabase/functions/muapi-proxy)
#   • large files  → direct browser → MuAPI using the user's own BYOK key
#   • saved assets → refetch the durable Supabase original in-browser, then
#                    re-upload through the same shared adapter
# Do NOT add a Netlify function that relays media bytes.

# Serve the model catalog as a static file in production.
# The vite build plugin emits dist/api/model-catalog.json containing all
# three pools (t2i / i2i / i2v); the frontend filters by modelType client-side.
# Proxy the Director (VideoDB) finishing backend in production.
# In dev this is handled by the Vite proxy in vite.config.js; Netlify builds
# need an explicit redirect proxy. Set DIRECTOR_API_URL as a build-time env var
# (Netlify dashboard) to the live director-backend URL, e.g.
# https://director-backend.onrender.com. If unset, requests fall through to the
# SPA fallback (which will 404 the API call) rather than silently mocking.
[[redirects]]
  from = "/director-api/*"
  to = "${DIRECTOR_API_URL}/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/model-catalog"
  to = "/api/model-catalog.json"
  status = 200
  force = true

# Stock media proxies (Pixabay / Pexels) as Netlify functions, so the
# editor's Stock Media, image search and overlay transitions work without a
# separate backend server. Keys: PIXABAY_API_KEY and PEXELS_API_KEY in the
# Netlify environment. Same routes as backend/services/*ProxyService.js.
[[redirects]]
  from = "/api/pixabay/*"
  to = "/.netlify/functions/pixabay/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/pexels/*"
  to = "/.netlify/functions/pexels/:splat"
  status = 200
  force = true

# Template Generator AI (script writing + image generation). These /api paths had no
# rewrite, so production served index.html (404) and the AI buttons failed.
[[redirects]]
  from = "/api/timeline-script"
  to = "/.netlify/functions/timeline-script"
  status = 200
  force = true

[[redirects]]
  from = "/api/timeline-image-generate"
  to = "/.netlify/functions/timeline-image-generate"
  status = 200
  force = true

# AI Video Agent (timeline editor): one model step per call. Keys stay
# server-side: OPENAI_API_KEY (default), ANTHROPIC_API_KEY (optional Claude).
[[redirects]]
  from = "/api/video-agent"
  to = "/.netlify/functions/video-agent"
  status = 200
  force = true

# AI Agent voiceover + music (MuAPI, MUAPI_API_KEY).
[[redirects]]
  from = "/api/agent-audio"
  to = "/.netlify/functions/agent-audio"
  status = 200
  force = true

# Timeline Editor paid AI (MuAPI only, user's own key): Fill Gap, Extend,
# layers, watermark removal. Submit + status polling.
[[redirects]]
  from = "/api/timeline-ai"
  to = "/.netlify/functions/timeline-ai"
  status = 200
  force = true

# Timeline Editor text AI (OpenAI Responses API, user's own key): chat modes,
# storyboard, script breakdown, shot list, beat sheet.
[[redirects]]
  from = "/api/timeline-llm"
  to = "/.netlify/functions/timeline-llm"
  status = 200
  force = true

[[redirects]]
  from = "/api/watch-voice"
  to = "/.netlify/functions/watch-voice"
  status = 200
  force = true

# Restored thumbnails are WebP-encoded but keep their historical `.webp.png`
# filenames so every existing reference resolves; declare the real type.
[[headers]]
  for = "/thumbnails/*.webp.png"
  [headers.values]
    Content-Type = "image/webp"
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/thumbnails/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Built JS/CSS are public; the Remotion export runner loads them from a
# sandboxed iframe (opaque origin), which needs CORS for module scripts.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# The public video player (/watch/<id>) can be embedded anywhere: its
# framing headers are rewritten by netlify/edge-functions/watch-embed.js
# (header rules below are merged, not overridden, so a rule can't do it).

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    # Allow the AI VFX Studio (deployed as a separate Next.js app on ai-vfx.smartvid.app)
    # to be embedded in its parent shell via iframe. 'self' permits same-origin
    # embedding (dev via Vite proxy); https://ai-vfx.smartvid.app is the production
    # Next.js app. DENY blocked every embed and produced the browser
    # "This content is blocked" page on every deploy.
    Content-Security-Policy = "frame-ancestors 'self' https://smartvid.app https://www.smartvid.app https://ai-vfx.smartvid.app https://teal-puffpuff-ce9767.netlify.app"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=()"

# Ensure the SPA fallback only fires when no file matches.
# Netlify's default redirect behavior already skips existing files.
# We list the auth routes explicitly to eliminate any ambiguity
# about which paths need the SPA shell versus raw asset serving.
[[redirects]]
  from = "/signin"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/forgot-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
from = "/profile"
to = "/index.html"
status = 200
force = false

# The embed mount itself has no trailing slash. Without this, /openthorn
# falls through to the parent SPA shell; force = false still prefers a real
# file if one ever exists at that path.
[[redirects]]
  from = "/openthorn"
  to = "/openthorn/index.html"
  status = 200
  force = false

# SPA fallback for the embedded Website Builder.
# Without this, /openthorn/* client-side routes would fall through to
# the parent SPA shell. `force = false` keeps real files like
# /openthorn/index.html and assets on direct file serving.
[[redirects]]
  from = "/openthorn/*"
  to = "/openthorn/index.html"
  status = 200
  force = false

# Missing images must 404, not fall through to the SPA shell. Serving
# index.html as an image makes every <img> fallback chain wait on an HTML
# download before it can try the next candidate.
[[redirects]]
  from = "/thumbnails/*"
  to = "/404.html"
  status = 404
  force = false

# SPA fallback: any path that doesn't match a real file or one of the
# explicit redirects above is served by the SPA shell (`/index.html`).
# This is the standard pattern for client-side hash-routed SPAs and
# prevents 404s for any menu link that incorrectly uses a real
# `<a href="/route">` instead of the in-app hash router.
# `force = false` so existing files (assets/, favicon, manifest, etc.)
# are still served directly without a redirect.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = false
