# Netlify build configuration
[build]
  command = "npm ci --include=optional && npm run build"
  publish = "dist"

[build.environment]
  NPM_FLAGS = "--include=optional"
  NODE_VERSION = "20"

# Model catalog alias
[[redirects]]
  from = "/api/model-catalog"
  to = "/api/model-catalog.json"
  status = 200
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=()"

# Ensure the SPA fallback only fires when no file matches.
# Netlify's default redirect behavior already skips existing files.
# We list the auth routes explicitly to eliminate any ambiguity
# about which paths need the SPA shell versus raw asset serving.
[[redirects]]
  from = "/signin"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/forgot-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/reset-password"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/account"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/profile"
  to = "/index.html"
  status = 200
  force = false
