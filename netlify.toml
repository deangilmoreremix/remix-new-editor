# Netlify build configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Explicitly run `npm ci --include=optional` as part of the build command.
  # The auto-install step that Netlify runs before this command does NOT
  # reliably forward NPM_FLAGS to `npm ci`, and `npm ci` without
  # --include=optional drops optional platform packages (npm/cli#4828).
  # Running the install ourselves inside the build command guarantees the
  # @tailwindcss/oxide native binary is present before Vite loads its config.
  command = "npm ci --include=optional && npm run build"
  publish = "dist"

# Defense in depth: also pass --include=optional to the auto-install step.
[build.environment]
  NPM_FLAGS = "--include=optional"
  NODE_VERSION = "20"

# Serve the model catalog as a static file in production.
# The vite build plugin emits dist/api/model-catalog.json containing all
# three pools (t2i / i2i / i2v); the frontend filters by modelType client-side.
[[redirects]]
  from = "/api/model-catalog"
  to = "/api/model-catalog.json"
  status = 200
  force = true

# Security headers sent as HTTP headers (X-Frame-Options cannot be set via
# <meta>, so it lives here). Kept off the Content-Security-Policy so the built
# bundle's inline runtime snippets are not blocked in production.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=()"
