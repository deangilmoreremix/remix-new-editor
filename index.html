<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Primary Meta Tags -->
    <title>SmartVideo — AI Video Generation Studio</title>
    <meta name="title" content="SmartVideo — AI Video Generation Studio" />
    <meta name="description" content="SmartVideo — the AI video generation studio. Create stunning AI videos with 20+ models including Flux, SDXL, Ideogram, and more." />
    <meta name="keywords" content="smartvideo, ai video generator, ai cinema studio, flux ai, ai video generation, open source ai video generation" />
    <meta name="author" content="SmartVideo" />
    <link rel="canonical" href="https://smartvid.app/" />

    <!-- Theme and PWA -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/favicon.webp" />

    <!-- Security Headers (via meta tags - full headers set via server).
         X-Frame-Options is intentionally omitted: browsers ignore it when set
         in a <meta> and only honor it as an HTTP header (set by the dev server
         in vite.config.js and by Netlify headers in netlify.toml). -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- Performance Hints -->
    <link rel="preconnect" href="https://api.muapi.ai" />
    <link rel="dns-prefetch" href="https://api.muapi.ai" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smartvid.app/" />
    <meta property="og:site_name" content="SmartVideo" />
    <meta property="og:title" content="SmartVideo — AI Video Generation Studio" />
    <meta property="og:description" content="Free, open-source AI image and video generation studio with 20+ models. Create professional images, videos, ads, characters, commercials and social content with AI." />
    <meta property="og:image" content="https://smartvid.app/thumbnails/heroes/image.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SmartVideo AI Video Generation Studio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@smartvideo" />
    <meta name="twitter:title" content="SmartVideo — AI Video Generation Studio" />
    <meta name="twitter:description" content="Free, open-source AI image and video generation studio with 20+ models. Create professional images, videos, ads, characters, commercials and social content with AI." />
    <meta name="twitter:image" content="https://smartvid.app/thumbnails/heroes/image.webp" />

    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SmartVideo",
      "alternateName": "SmartVideo AI",
      "url": "https://smartvid.app/",
      "description": "Free, open-source AI image and video generation studio with 20+ models. Create professional images, videos, ads, characters, commercials and social content with AI.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "AI Image Generation",
        "AI Video Generation",
        "Cinematic Video Creation",
        "Character Creation",
        "Commercial Video Production",
        "Social Media Content Creation",
        "AI VFX",
        "Lip Sync",
        "Avatar Generation",
        "Video Editing"
      ],
      "screenshot": "https://smartvid.app/thumbnails/heroes/image.webp",
      "author": {
        "@type": "Organization",
        "name": "SmartVideo",
        "url": "https://smartvid.app/"
      }
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
