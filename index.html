<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Personalization Platform - Vanilla JS + Vite</title>
  <meta name="description" content="Create personalized videos at scale with AI avatars, neural TTS, and professional video generation. Sendspark alternative with vanilla JavaScript.">
  <link rel="stylesheet" href="./styles/globals.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>
  <div id="app"></div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('Service Worker registered:', registration);
          })
          .catch(error => {
            console.error('Service Worker registration failed:', error);
          });
      });
    }
  </script>

  <!-- Main Application Script -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
