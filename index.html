<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-48.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09070B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="alternate" type="application/rss+xml" title="Smart Video Blog" href="https://www.smartvid.app/rss.xml" />
    <meta name="description" content="Smart Video AI Website Builder is the BYOK AI website builder — describe what you want, get a complete, deployable website. No subscription, no lock-in." />
    <title>Smart Video AI Website Builder</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.smartvid.app/" />
    <meta property="og:title" content="Smart Video AI Website Builder" />
    <meta property="og:description" content="Describe what you want, get a complete, deployable website. Bring your own API key — no subscription, no lock-in." />
    <meta property="og:image" content="https://www.smartvid.app/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Smart Video AI Website Builder — the BYOK AI website builder" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Smart Video" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Video AI Website Builder" />
    <meta name="twitter:description" content="Describe what you want, get a complete, deployable website. Bring your own API key — no subscription, no lock-in." />
    <meta name="twitter:image" content="https://www.smartvid.app/og-card.png" />

    <!-- Sitewide structured data: Organization + WebSite (per-page schemas are
         injected at runtime via useJsonLd and at build time via scripts/prerender.mjs) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Smart Video",
        "url": "https://www.smartvid.app",
        "logo": "https://www.smartvid.app/logo.png"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Smart Video",
        "url": "https://www.smartvid.app"
      }
    </script>

    <!-- Fonts are self-hosted via Fontsource (imported in src/main.tsx) — no external font requests -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
