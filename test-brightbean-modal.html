<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightbean Schedule Modal Test</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: #09070B; margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #modal-root { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); z-index: 1000; }
  </style>
</head>
<body>
  <div style="color: #fff; margin-bottom: 20px;">
    <h1>Brightbean Schedule Modal Test</h1>
    <p>Click the button below to open the scheduling modal.</p>
    <button id="open-modal" style="padding: 12px 24px; background: linear-gradient(135deg, #6d5efc, #a855f7); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;">
      Open Schedule Modal
    </button>
  </div>
  <div id="modal-root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;
    
    // Brightbean API client (simulated)
    const brightbean = {
      listAccounts: async () => [
        { id: '1', platform: 'youtube', account_name: 'Test YouTube', account_handle: '@test', connection_status: 'connected' },
        { id: '2', platform: 'instagram', account_name: 'Test Instagram', account_handle: '@testig', connection_status: 'connected' }
      ],
      uploadMedia: async (blob, opts) => ({ id: 'asset-123' }),
      createScheduledPost: async (data) => ({ id: 'post-456', ...data })
    };

    const APP_ACCENT = '#6d5efc';
    const APP_ACCENT2 = '#a855f7';
    const inputStyle = { width: '100%', boxSizing: 'border-box', background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 10, color: '#fff', padding: '10px 12px', fontSize: 14, outline: 'none' };
    const labelStyle = { display: 'block', fontSize: 12, fontWeight: 600, letterSpacing: 0.4, textTransform: 'uppercase', color: 'rgba(255,255,255,0.55)', margin: '14px 0 6px' };

    function BrightbeanScheduleModal({ options = {}, handleClose }) {
      const [mediaUrl, setMediaUrl] = useState('https://example.com/video.mp4');
      const [caption, setCaption] = useState('Check out our latest product launch! 🚀');
      const [title, setTitle] = useState('Product Launch');
      const [firstComment, setFirstComment] = useState('');
      const [scheduledAt, setScheduledAt] = useState('2026-12-31T12:00');
      const [selectedAccountId, setSelectedAccountId] = useState(null);
      const [accounts, setAccounts] = useState([]);
      const [status, setStatus] = useState('idle');
      const [progress, setProgress] = useState('');
      const [errorMsg, setErrorMsg] = useState(null);

      useEffect(() => {
        brightbean.listAccounts().then(setAccounts).catch(() => setAccounts([]));
      }, []);

      const selectedAccount = useMemo(() => accounts.find(a => String(a.id) === String(selectedAccountId)) || null, [accounts, selectedAccountId]);
      const canSubmit = Boolean(selectedAccount && mediaUrl && scheduledAt && caption.trim());

      const handleSchedule = async () => {
        setErrorMsg(null);
        setStatus('uploading');
        setProgress('Uploading media...');
        try {
          const asset = { id: 'asset-123' };
          setStatus('scheduling');
          setProgress('Scheduling post...');
          await new Promise(r => setTimeout(r, 1500));
          const result = await brightbean.createScheduledPost({
            socialAccountId: selectedAccountId, caption, title,
            scheduledAt: new Date(scheduledAt).toISOString(),
            mediaAssetIds: [asset.id],
            firstComment,
          });
          setStatus('success');
          setProgress('Post scheduled successfully!');
          setTimeout(() => handleClose(), 2000);
        } catch (e) { setErrorMsg(e.message || 'Could not schedule post.'); setStatus('error'); setProgress(''); }
      };

      return (
        <div style={{ padding: '8px 8px 4px', color: '#fff', minWidth: 520, maxWidth: 640, position: 'relative' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 16, padding: '6px 8px 12px', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
            <div style={{ width: 34, height: 34, borderRadius: 9, background: `linear-gradient(135deg,${APP_ACCENT},${APP_ACCENT2})`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18 }}>📅</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 17, fontWeight: 800 }}>Schedule Post</div>
              <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.45)' }}>Via Smart Video Scheduler · Video</div>
            </div>
          </div>
          {errorMsg && <div style={{ background: 'rgba(255,80,80,0.15)', border: '1px solid rgba(255,80,80,0.3)', borderRadius: 8, padding: '10px 14px', marginBottom: 14, color: '#ff9a9a', fontSize: 13 }}>{errorMsg}</div>}
          {status === 'success' && <div style={{ background: 'rgba(80,255,120,0.15)', border: '1px solid rgba(80,255,120,0.3)', borderRadius: 8, padding: '10px 14px', marginBottom: 14, color: '#9affa9', fontSize: 13 }}>✓ Post scheduled!</div>}
          {progress && status !== 'success' && <div style={{ background: 'rgba(109,94,252,0.12)', border: '1px solid rgba(109,94,252,0.3)', borderRadius: 8, padding: '10px 14px', marginBottom: 14, fontSize: 13 }}>⏳ {progress}</div>}
          
          <div style={{ border: '1px solid rgba(255,255,255,0.08)', borderRadius: 14, padding: 16, marginBottom: 16, background: 'rgba(255,255,255,0.02)' }}>
            <div style={{ ...labelStyle, margin: '0 0 8px' }}>Media</div>
            <input style={inputStyle} placeholder="Media URL" value={mediaUrl} onChange={e => setMediaUrl(e.target.value)} />
          </div>
          
          <div style={{ border: '1px solid rgba(255,255,255,0.08)', borderRadius: 14, padding: 16, marginBottom: 16, background: 'rgba(255,255,255,0.02)' }}>
            <div style={{ ...labelStyle, margin: '0 0 8px' }}>Account</div>
            {accounts.map(acc => (
              <button key={acc.id} type="button" onClick={() => setSelectedAccountId(String(acc.id))} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 10, textAlign: 'left', width: '100%', marginBottom: 6, border: `1px solid ${String(acc.id) === String(selectedAccountId) ? APP_ACCENT : 'rgba(255,255,255,0.1)'}`, background: String(acc.id) === String(selectedAccountId) ? 'rgba(109,94,252,0.12)' : 'rgba(255,255,255,0.03)', color: '#fff', cursor: 'pointer' }}>
                <input type="radio" checked={String(acc.id) === String(selectedAccountId)} readOnly />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{acc.account_name}</div>
                  <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.5)' }}>{acc.platform} · {acc.connection_status}</div>
                </div>
              </button>
            ))}
          </div>
          
          <div style={{ border: '1px solid rgba(255,255,255,0.08)', borderRadius: 14, padding: 16, marginBottom: 16, background: 'rgba(255,255,255,0.02)' }}>
            <div style={{ ...labelStyle, margin: '0 0 8px' }}>Content</div>
            <input style={inputStyle} placeholder="Title (for YouTube)" value={title} onChange={e => setTitle(e.target.value)} maxLength={255} />
            <textarea style={{ ...inputStyle, marginTop: 10, minHeight: 60, resize: 'vertical' }} placeholder="Write your caption…" value={caption} onChange={e => setCaption(e.target.value)} maxLength={10000} />
            <textarea style={{ ...inputStyle, marginTop: 10, minHeight: 36, resize: 'vertical' }} placeholder="First comment (optional)" value={firstComment} onChange={e => setFirstComment(e.target.value)} maxLength={10000} />
          </div>
          
          <div style={{ border: '1px solid rgba(255,255,255,0.08)', borderRadius: 14, padding: 16, marginBottom: 16, background: 'rgba(255,255,255,0.02)' }}>
            <div style={{ ...labelStyle, margin: '0 0 8px' }}>Schedule</div>
            <input type="datetime-local" style={inputStyle} value={scheduledAt} onChange={e => setScheduledAt(e.target.value)} />
          </div>
          
          <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', padding: '8px 0' }}>
            <button type="button" onClick={handleClose} style={{ background: 'transparent', color: 'rgba(255,255,255,0.75)', border: '1px solid rgba(255,255,255,0.10)', borderRadius: 8, padding: '8px 14px', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Cancel</button>
            <button type="button" onClick={handleSchedule} disabled={!canSubmit} style={{ background: !canSubmit ? 'rgba(255,255,255,0.1)' : 'linear-gradient(135deg,#6d5efc,#a855f7)', color: '#fff', border: 'none', borderRadius: 8, padding: '8px 14px', fontSize: 12, fontWeight: 700, cursor: !canSubmit ? 'not-allowed' : 'pointer' }}>📅 Schedule</button>
          </div>
        </div>
      );
    }

    function App() {
      const [modalOpen, setModalOpen] = useState(false);
      
      return (
        <div>
          {modalOpen && (
            <div id="modal-root" style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(0,0,0,0.8)', zIndex: 1000, backdropFilter: 'blur(8px)' }}>
              <div style={{ background: '#0B0D16', borderRadius: 20, boxShadow: '0 20px 60px rgba(0,0,0,0.5)' }}>
                <BrightbeanScheduleModal 
                  options={{ mediaUrl: 'https://example.com/video.mp4', mediaType: 'video' }}
                  handleClose={() => setModalOpen(false)}
                />
              </div>
            </div>
          )}
          <div style={{ color: '#fff', textAlign: 'center', padding: '40px' }}>
            <h1>Brightbean Schedule Modal</h1>
            <p style={{ color: 'rgba(255,255,255,0.6)' }}>Click below to preview the modal</p>
            <button 
              onClick={() => setModalOpen(true)}
              style={{ padding: '14px 28px', background: 'linear-gradient(135deg, #6d5efc, #a855f7)', color: '#fff', border: 'none', borderRadius: 10, cursor: 'pointer', fontSize: 15, fontWeight: 600, marginTop: 20 }}
            >
              Open Schedule Modal
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('brightbean-app'));
    root.render(<App />);
  </script>
</body>
</html>
