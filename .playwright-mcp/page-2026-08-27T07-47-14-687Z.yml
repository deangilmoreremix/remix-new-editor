      - listitem [ref=f3e221]: Library - Store, organize, reuse, and manage generated assets, projects, videos, images, templates, and campaign materials.
      - listitem [ref=f3e222]: Community - Showcase examples, discover creative workflows, highlight user creations, and build a community around AI video creation.
