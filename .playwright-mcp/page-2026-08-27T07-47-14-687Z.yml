    - list [ref=f3e206]:
      - listitem [ref=f3e207]: Image - Generate high-quality AI images for ads, thumbnails, product visuals, social media, websites, and client campaigns.
      - listitem [ref=f3e208]: Video - Create text-to-video, image-to-video, video-to-video, and cinematic motion content for social, ads, and branded campaigns.
