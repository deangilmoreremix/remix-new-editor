<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Blend Mode Test (client-only)</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    #popcorn-test {
      position: relative;
      width: 600px;
      height: 400px;
      border: 1px solid #333;
      overflow: hidden;
    }
    /* Colored background div BEHIND the popcorn image element */
    #bg {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(45deg, #ff3b30 0 40px, #ffcc00 40px 80px);
      z-index: 0;
    }
    /* Popcorn renders its _container into #video-overlay; keep it above bg */
    #video-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    .controls { margin: 12px 0; }
    button { padding: 8px 14px; margin-right: 8px; cursor: pointer; }
    #status { font-family: monospace; white-space: pre-wrap; }
    .image-plugin-img { /* make the image fill its container so blend is visible */
      width: 70% !important;
      height: 70% !important;
      margin: 15%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <h2>Blend Mode Test &mdash; client-only, no /api/ calls</h2>
  <div class="controls">
    <button data-mode="multiply">multiply</button>
    <button data-mode="screen">screen</button>
    <button data-mode="difference">difference</button>
    <button data-mode="normal">normal (reset)</button>
  </div>
  <div id="popcorn-test">
    <div id="bg"></div>
    <div id="video-overlay"></div>
  </div>
  <pre id="status">initializing…</pre>

  <script type="module">
    const status = document.getElementById('status');
    const log = (...a) => { status.textContent += a.join(' ') + '\n'; };

    // Use the REAL app init sequence (src/lib/popcornInit.js) so every
    // prerequisite (jquery -> window.jQuery, core, ie8, 9 wrappers,
    // player-module -> Popcorn.player, then plugins) is loaded in the exact
    // order the full app uses. Loading popcorn-core + the image plugin in
    // isolation skipped those steps and left window.Popcorn.image undefined.
    const { initPopcorn } = await import('/src/lib/popcornInit.js');
    try {
      await initPopcorn();
    } catch (err) {
      log('FAIL during initPopcorn():', err && err.message ? err.message : String(err));
      throw err;
    }

    if (!window.Popcorn) { log('FAIL: window.Popcorn not defined'); throw new Error('no Popcorn'); }
    if (typeof window.Popcorn.image !== 'function') { log('FAIL: Popcorn.image plugin not registered'); throw new Error('no image plugin'); }
    log('Popcorn ready, image plugin registered.');

    // A local data-URI image (no network) so the blend is visible over the bg.
    const SRC = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">' +
      '<rect width="300" height="300" fill="#0a84ff"/>' +
      '<circle cx="150" cy="150" r="90" fill="#30d158"/>' +
      '</svg>'
    );

    const target = 'video-overlay';

    // Render ONCE. The image plugin is time-driven (needs a media element to
    // fire timeupdate); with no <video> we render once and then toggle the
    // blend directly on the container the plugin decorated with mix-blend-mode
    // (plugin lines 409-410). This is the exact CSS property the plugin sets,
    // proving blend modes work on rendered popcorn content without a media
    // driver or a /api/ call.
    const p = window.Popcorn('popcorn-test');
    p.image(target, {
      start: 0,
      end: 100000,
      src: SRC,
      top: 0,
      left: 0,
      width: 100,
      height: 100,
      zindex: 1,
      blendMode: 'multiply',
    });

    const overlay = document.getElementById('video-overlay');
    const container = overlay
      && (overlay.querySelector('[style*="mix-blend-mode"]') || overlay.firstElementChild);

    function render(mode) {
      if (!container) { log('FAIL: popcorn container not found'); return; }
      // Drive the plugin's documented mechanism (live-update path, plugin
      // lines 737-739) and also set the style directly so the change is
      // immediate/visible without a media time driver.
      try { p.image(target, { blendMode: mode }); } catch (e) { /* time-gated */ }
      container.style.mixBlendMode = mode;
      const applied = container.style.mixBlendMode || '(none)';
      log(`set blendMode="${mode}" -> container mix-blend-mode: ${applied}`);
    }

    document.querySelectorAll('button[data-mode]').forEach((btn) => {
      btn.addEventListener('click', () => render(btn.dataset.mode));
    });

    render('multiply');
    if (!container) {
      log('WARN: popcorn container not found — blend style cannot be applied.');
    } else {
      log('Container found. Click a button to toggle blend mode — the image should re-composite over the striped background.');
    }
  </script>
</body>
</html>
