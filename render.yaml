# render.yaml — deploys the Video Agent backend as a Render Web Service.
# Usage:
#   render blueprints launch  # first time: creates the service from this file
#   render deploy             # redeploy after changes
#
# NOTE: API keys are NOT committed. Set VIDEO_DB_API_KEY and OPENAI_API_KEY in
# the Render dashboard (Service -> Environment) as sync:false values.
# Users may also supply their own keys per-request:
#   - VideoDB: x-access-token header (proxy falls back to server key)
#   - OpenAI: payload.apiKey (videoAgentService already supports this)

services:
  - type: web
    name: videoagent-backend
    runtime: node
    repo: https://github.com/deangilmoreremix/remix-new-editor.git
    region: oregon          # pick the region closest to most of your users
    rootDir: backend
    plan: free              # free tier; upgrade (starter) for always-on + ffmpeg headroom
    branch: backend-real-outputs   # deploy the completed backend from this worktree branch
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"      # Render injects the actual PORT; this is a safe default
      - key: OPENAI_API_KEY
        sync: false         # configure in the Render dashboard
      - key: VIDEO_DB_API_KEY
        sync: false         # configure in the Render dashboard
      - key: VIDEO_DB_BASE_URL
        value: https://api.videodb.io
      - key: VIDEO_DB_DEFAULT_COLLECTION
        value: default
      - key: VIDEO_AGENT_BACKEND_URL
        sync: false         # set to this service's URL after deploy, e.g. https://videoagent-backend.onrender.com
